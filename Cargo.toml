[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.2.0-alpha"
edition = "2024"
license = "GNU GPL v3"

[workspace.dependencies]
vito-core = { path = "crates/vito-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
dotenvy = "0.15"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "rustls_backend", "collector", "utils", "voice", "cache"] }
chrono = "0.4.45"
colored = "3.1.1"
rand = "0.10.3"
mathengine = "0.1.1"
nekosbest = "0.21"
reqwest = { version = "0.12", default-features = false }
songbird = "0.6"
symphonia = { version = "0.5", features = ["aac", "mp3", "isomp4", "alac"] }