[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GNU GPL v3"

[workspace.dependencies]
rupert-core = { path = "crates/rupert-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "rustls_backend", "collector", "utils",] }
chrono = "0.4.45"
colored = "3.1.1"
rand = "0.9"
mathengine = "0.1.1"
nekosbest = "0.21"