name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    env:
      VITO_ENV_FILE: ${{ vars.VITO_ENV_FILE || '/opt/docker/bots/.env' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versioning
        id: version
        run: |
          VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::La versión de Cargo.toml no es major.minor.fix[-pre]: '$VERSION'"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION ya está publicada. Sube la versión en Cargo.toml."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Image
        env:
          VITO_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker compose build
          docker tag "vito-discord:$VITO_VERSION" vito-discord:latest

      - name: Container
        env:
          VITO_VERSION: ${{ steps.version.outputs.version }}
        run: docker compose up -d --no-build --remove-orphans

      - name: Git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Clean orphan images
        run: docker image prune -f
